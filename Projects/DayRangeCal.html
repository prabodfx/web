<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <link rel="icon" type="image/png" href="../Projects/fc/dayRange/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="../Projects/fc/dayRange/favicon.svg" />
  <link rel="shortcut icon" href="../Projects/fc/dayRange/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../Projects/fc/dayRange/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="DayRange CAL" />
  <link rel="manifest" href="../Projects/fc/dayRange/site.webmanifest" />
  <title>Day Range Count | Prabodfx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    input { font-size: 16px; }
  </style>
</head>
<body class="bg-slate-900 text-white font-inter min-h-screen p-4">

  <div class="min-h-screen w-full flex items-center justify-center">
    <main class="w-full max-w-4xl mx-auto flex flex-col items-center justify-center text-center space-y-8">
      
      <section class="space-y-2">
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-transparent bg-clip-text 
           bg-gradient-to-r from-blue-400 to-purple-600 leading-[1.2] pb-1">
          Day Range Count
        </h1>
      </section>
  
      <section class="bg-gray-800 bg-opacity-70 backdrop-blur-md rounded-3xl p-6 sm:p-8 w-full shadow-lg border border-gray-700">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left">
          <div>
            <label for="from" class="block text-sm font-medium text-slate-300 mb-2 text-left">From</label>
            <div class="relative">
              <input id="from" type="text" inputmode="numeric" enterkeyhint="next" autocomplete="off" aria-label="From date"
                placeholder="MMDD or YYYYMMDD"
                class="w-full px-4 py-3 rounded-2xl bg-gray-900 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all duration-200 text-white font-bold"
                maxlength="10" autofocus>
            </div>
          </div>
          <div>
            <label for="to" class="block text-sm font-medium text-slate-300 mb-2 text-left">To</label>
            <div class="relative">
              <input id="to" type="text" inputmode="numeric" enterkeyhint="next" autocomplete="off" aria-label="To date"
                placeholder="MMDD or YYYYMMDD"
                class="w-full px-4 py-3 rounded-2xl bg-gray-900 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all duration-200 text-white font-bold"
                maxlength="10">
            </div>
          </div>
        </div>
  
        <div class="flex flex-wrap justify-center gap-4 mt-6">
          <button id="calc"
            class="btn bg-gradient-to-r from-blue-500 to-purple-600 text-white font-bold py-3 px-6 rounded-2xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 w-full sm:w-auto">
            Calculate
          </button>
          <button id="single"
            class="btn bg-gray-700 text-gray-300 font-bold py-3 px-6 rounded-2xl shadow-lg hover:bg-gray-600 transition-all duration-200 w-full sm:w-auto">
            Count With Today
          </button>
          <button id="swap"
            class="btn bg-gray-700 text-gray-300 font-bold py-3 px-6 rounded-2xl shadow-lg hover:bg-gray-600 transition-all duration-200 w-full sm:w-auto">
            Swap
          </button>
        </div>
  
        <div id="result-container" class="mt-6 p-4 sm:p-6 rounded-2xl bg-gray-900 border border-gray-700">
          <div id="status" class="inline-flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-full mb-3"
            style="background: linear-gradient(90deg, #22c55e, #a3e635); color: #06101f;">
            Ready
          </div>
          <div class="text-6xl sm:text-7xl font-extrabold flex items-baseline justify-center gap-2 mb-2">
            <span id="days">—</span>
            <span id="days-unit" class="text-xl sm:text-2xl text-slate-400 font-medium">Days</span>
          </div>
          <div class="text-red-500 text-sm mt-1" id="error" style="display:none"></div>
          <div class="text-slate-500 text-xs mt-3">
            <span id="example" class="inline-flex items-center gap-2 px-3 py-1 rounded-full cursor-pointer hover:bg-gray-800 transition-colors">
              Example : 2004-08-06 =<div class="text-slate-400 text-sm" id="explain">7683 days</div>
            </span>
          </div>
        </div>
      </section>
  
      <footer class="text-slate-500 text-xs opacity-80">
        Prabodfx Creations
      </footer>
    </main>
  </div>
  
  <script>
    const el = {
      from: document.getElementById('from'),
      to: document.getElementById('to'),
      calc: document.getElementById('calc'),
      single: document.getElementById('single'),
      swap: document.getElementById('swap'),
      days: document.getElementById('days'),
      daysUnit: document.getElementById('days-unit'),
      status: document.getElementById('status'),
      error: document.getElementById('error'),
      explain: document.getElementById('explain'),
      example: document.getElementById('example')
    };

    const inputModes = { from: 'date', to: 'date' };
    
    let lastFocusedInput = el.to; 

    el.from.addEventListener('focus', () => { lastFocusedInput = el.from; });
    el.to.addEventListener('focus', () => { lastFocusedInput = el.to; });

    function setStatus(msg, ok = true) {
      el.status.textContent = msg;
      el.status.style.background = ok ? 'linear-gradient(90deg, #22c55e, #a3e635)' : 'linear-gradient(90deg, #ef4444, #f43f5e)';
    }

    function setInputMode(id, mode) {
      inputModes[id] = mode;
      const inputEl = el[id];
      const label = document.querySelector(`label[for="${id}"]`);
      
      if (mode === 'number') {
        label.textContent = id === 'from' ? 'From (Days)' : 'To (Days)';
        inputEl.placeholder = 'Number of Days';
        inputEl.classList.add('text-blue-400');
        inputEl.classList.remove('text-white');
      } else {
        label.textContent = id === 'from' ? 'From' : 'To';
        inputEl.placeholder = 'MMDD or YYYYMMDD';
        inputEl.classList.remove('text-blue-400');
        inputEl.classList.add('text-white');
      }
    }

    function toggleModeForInput(inputEl) {
      const currentId = inputEl.id;
      const otherId = currentId === 'from' ? 'to' : 'from';
      
      if (inputModes[currentId] === 'date') {
        if (inputModes[otherId] === 'number') return;
        setInputMode(currentId, 'number');
        // Do NOT clear value when changing to Numbers mode
      } else {
        setInputMode(currentId, 'date');
        inputEl.value = ''; // CLEAR value when changing back to Days mode
      }
      render();
    }

    function isValidYMD(y, m, d) {
      const dt = new Date(y, m - 1, d);
      return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
    }

    function parseDateInput(v) {
      if (!v) return null;
      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) {
        const [y, m, d] = v.split('-').map(Number);
        if (isValidYMD(y, m, d)) return { y, m, d };
        return null;
      }
      return null;
    }

    function inclusiveDays(a, b) {
      const dateA = new Date(a.y, a.m - 1, a.d);
      const dateB = new Date(b.y, b.m - 1, b.d);
      const diff = Math.abs(dateB - dateA);
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function closeMobileKeyboard() {
      [el.from, el.to].forEach(inp => {
        inp.setAttribute('readonly', 'true');
        inp.blur();
        setTimeout(() => inp.removeAttribute('readonly'), 50);
      });
    }

    function finishIfBothValid() {
      const fromVal = el.from.value.trim();
      const toVal = el.to.value.trim();
      if (!fromVal || !toVal) return false;

      let valid = false;
      if (inputModes.from === 'date' && inputModes.to === 'date') {
        if (parseDateInput(fromVal) && parseDateInput(toVal)) valid = true;
      } else if (inputModes.from === 'date' && inputModes.to === 'number') {
        if (parseDateInput(fromVal) && /^-?\d+$/.test(toVal)) valid = true;
      } else if (inputModes.from === 'number' && inputModes.to === 'date') {
        if (/^-?\d+$/.test(fromVal) && parseDateInput(toVal)) valid = true;
      }

      if (valid) {
        render();
        closeMobileKeyboard();
        return true;
      }
      return false;
    }

    function autoFormat(input, next) {
      let v = input.value;
      if (inputModes[input.id] === 'number') {
        if (v.startsWith('-')) {
          input.value = '-' + v.slice(1).replace(/\D/g, '');
        } else {
          input.value = v.replace(/\D/g, '');
        }
        return;
      }

      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return;

      const digits = v.replace(/\D/g, '');
      const today = new Date();

      if (digits.length === 8) {
        const y = Number(digits.slice(0, 4));
        const m = Number(digits.slice(4, 6));
        const d = Number(digits.slice(6, 8));
        if (isValidYMD(y, m, d)) {
          input.value = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          if (next && !next.value && inputModes[next.id] === 'date') next.focus();
          finishIfBothValid();
          return;
        }
      }

      input.value = digits;
    }

    function applyFinalFormat(input) {
      if (inputModes[input.id] === 'number') return;
      const v = input.value;
      
      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return;

      const digits = v.replace(/\D/g, '');
      if (!digits) return;

      const today = new Date();
      const currY = today.getFullYear();
      let y, m, d;
      let formatted = false;

      if (digits.length === 2) {
        y = currY; m = Number(digits.slice(0,1)); d = Number(digits.slice(1,2));
        if (isValidYMD(y, m, d)) formatted = true;
      } else if (digits.length === 3) {
        // Pattern: 112 -> currY-01-12 (M-DD Priority)
        y = currY; m = Number(digits.slice(0,1)); d = Number(digits.slice(1,3));
        if (isValidYMD(y, m, d)) formatted = true;
        else {
            m = Number(digits.slice(0,2)); d = Number(digits.slice(2,3));
            if (isValidYMD(y, m, d)) formatted = true;
        }
      } else if (digits.length === 4) {
        const firstTwo = Number(digits.slice(0,2));
        if (firstTwo > 12) {
            // Pattern: 2411 -> 2024-01-01 (YY-M-D)
            y = 2000 + firstTwo; m = Number(digits.slice(2,3)); d = Number(digits.slice(3,4));
            if (isValidYMD(y, m, d)) formatted = true;
        } else {
            // Priority: MMDD
            y = currY; m = firstTwo; d = Number(digits.slice(2,4));
            if (isValidYMD(y, m, d)) formatted = true;
            else {
                y = 2000 + firstTwo; m = Number(digits.slice(2,3)); d = Number(digits.slice(3,4));
                if (isValidYMD(y, m, d)) formatted = true;
            }
        }
      } else if (digits.length === 6) {
        const firstFour = Number(digits.slice(0,4));
        if (firstFour >= 1900 && firstFour <= 2100) {
            // Pattern: 199956 -> 1999-05-06 (YYYY-M-D)
            y = firstFour; m = Number(digits.slice(4,5)); d = Number(digits.slice(5,6));
            if (isValidYMD(y, m, d)) formatted = true;
        }
        if (!formatted) {
            // YY-MM-DD
            y = 2000 + Number(digits.slice(0,2)); m = Number(digits.slice(2,4)); d = Number(digits.slice(4,6));
            if (isValidYMD(y, m, d)) formatted = true;
        }
      } else if (digits.length === 8) {
        y = Number(digits.slice(0,4)); m = Number(digits.slice(4,6)); d = Number(digits.slice(6,8));
        if (isValidYMD(y, m, d)) formatted = true;
      }

      if (formatted) {
        input.value = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      }
    }

    function render() {
      el.error.style.display = 'none';
      const fromStr = el.from.value.trim();
      const toStr = el.to.value.trim();

      if (!fromStr || !toStr) {
        el.days.textContent = '—';
        el.daysUnit.textContent = 'Days';
        setStatus('Ready');
        return;
      }

      try {
        if (inputModes.from === 'date' && inputModes.to === 'date') {
          const A = parseDateInput(fromStr);
          const B = parseDateInput(toStr);
          if (A && B) {
            const d = inclusiveDays(A, B);
            el.days.textContent = String(d);
            el.daysUnit.textContent = 'Days';
            setStatus('Calculated');
          } else {
            el.days.textContent = '—';
            el.daysUnit.textContent = 'Days';
          }
        } 
        else if (inputModes.from === 'date' && inputModes.to === 'number') {
          const A = parseDateInput(fromStr);
          const numB = Number(toStr);
          if (A && !isNaN(numB)) {
            const baseDate = new Date(A.y, A.m - 1, A.d);
            baseDate.setDate(baseDate.getDate() + numB);
            const resY = baseDate.getFullYear();
            const resM = String(baseDate.getMonth() + 1).padStart(2, '0');
            const resD = String(baseDate.getDate()).padStart(2, '0');
            el.days.textContent = `${resY}/${resM}/${resD}`;
            el.daysUnit.textContent = '';
            setStatus('Calculated');
          }
        } 
        else if (inputModes.from === 'number' && inputModes.to === 'date') {
          const numA = Number(fromStr);
          const B = parseDateInput(toStr);
          if (!isNaN(numA) && B) {
            const baseDate = new Date(B.y, B.m - 1, B.d);
            baseDate.setDate(baseDate.getDate() - numA);
            const resY = baseDate.getFullYear();
            const resM = String(baseDate.getMonth() + 1).padStart(2, '0');
            const resD = String(baseDate.getDate()).padStart(2, '0');
            el.days.textContent = `${resY}/${resM}/${resD}`;
            el.daysUnit.textContent = '';
            setStatus('Calculated');
          }
        }
      } catch (e) {
        el.error.textContent = 'Invalid date or number input.';
        el.error.style.display = 'block';
        setStatus('Error', false);
      }
    }

    el.from.addEventListener('input', () => { autoFormat(el.from, el.to); render(); });
    el.to.addEventListener('input', () => { autoFormat(el.to, null); render(); });

    el.from.addEventListener('blur', () => { applyFinalFormat(el.from); render(); finishIfBothValid(); });
    el.to.addEventListener('blur', () => { applyFinalFormat(el.to); render(); finishIfBothValid(); });

    function handleModeShortcuts(e, inp) {
      if (e.key === '.' || e.key === ' ' || e.key === '-') {
        if (e.key === '-' && inputModes[inp.id] === 'number' && inp.value === '') {
          return;
        }
        e.preventDefault();
        toggleModeForInput(inp);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        applyFinalFormat(inp);
        render();
        const nextInp = inp === el.from ? el.to : el.from;
        if (!finishIfBothValid()) nextInp.focus();
      }
    }

    el.from.addEventListener('keydown', (e) => handleModeShortcuts(e, el.from));
    el.to.addEventListener('keydown', (e) => handleModeShortcuts(e, el.to));
    
    el.calc.addEventListener('click', e => { 
      e.preventDefault(); 
      finishIfBothValid() || render(); 
    });
    
    el.from.addEventListener('dblclick', () => { el.from.value = ''; render(); });
    el.to.addEventListener('dblclick', () => { el.to.value = ''; render(); });

    el.single.addEventListener('click', e => {
      e.preventDefault();

      if (inputModes.from === 'number') {
        setInputMode('from', 'date');
        el.from.value = '';
      }
      if (inputModes.to === 'number') {
        setInputMode('to', 'date');
        el.to.value = '';
      }

      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const todayStr = `${yyyy}-${mm}-${dd}`;

      if (el.from.value && !el.to.value) {
        el.to.value = todayStr;
        el.to.focus();
      } else if (el.to.value && !el.from.value) {
        el.from.value = todayStr;
        el.from.focus();
      } else {
        el.from.value = todayStr;
        el.from.focus();
      }
      render();
      finishIfBothValid();
    });

    el.swap.addEventListener('click', e => {
      e.preventDefault();
      toggleModeForInput(lastFocusedInput);
      lastFocusedInput.focus();
    });

    el.example.addEventListener('click', () => {
      setInputMode('from', 'date');
      setInputMode('to', 'date');
      el.from.value = '2024-08-19';
      el.to.value = '2004-08-06';
      render();
      finishIfBothValid();
    });

    window.addEventListener('load', () => {
      el.from.focus();
    });
  </script>
  
</body>
</html>
