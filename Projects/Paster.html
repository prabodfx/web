<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/png" href="../Projects/fc/paster/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../Projects/fc/paster/favicon.svg" />
    <link rel="shortcut icon" href="../Projects/fc/paster/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../Projects/fc/paster/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Paster" />
    <link rel="manifest" href="../Projects/fc/paster/site.webmanifest" />
    <title>Auto Paste | Prabodfx</title>
    <style>
        :root {
            /* Ultra-Premium Light Glassmorphism Palette */
            --bg-base: #f1f5f9; 
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            
            /* Premium Blue Highlight Palette */
            --accent-blue: #2563eb;
            --glass-bg-active: rgba(239, 246, 255, 0.7);
            --glass-border-active: rgba(37, 99, 235, 0.35);
            
            --text-primary: #0f172a; 
            --text-muted: #64748b;
            
            /* High-Fidelity Soft Shadows */
            --shadow-card: 0 8px 32px 0 rgba(31, 38, 135, 0.04), inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
            --shadow-active: 0 12px 40px -10px rgba(37, 99, 235, 0.15), 0 0 0 1px var(--accent-blue);
            
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 5rem 2rem; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            position: relative;
            -webkit-user-select: none;
            user-select: none; 
            background-image: 
                radial-gradient(at 0% 0%, rgba(186, 230, 253, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(221, 214, 254, 0.3) 0px, transparent 50%);
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 3.5rem;
        }

        .brand-header {
            text-align: center;
            animation: fadeDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .brand-header h1 {
            margin-top: -50px;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.5em;
            color: var(--text-primary);
            text-indent: 0.5em;
            opacity: 0.9;
        }

        .card-stream {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
            transition: opacity 0.3s ease;
        }

        /* Premium Light Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-card);
            border-radius: 16px;
            padding: 1.75rem 2.25rem;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 2rem; 
            transition: var(--transition-smooth);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.65);
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }

        /* Active Blue Highlighted State */
        .glass-card.highlighted {
            background: var(--glass-bg-active);
            border-color: var(--glass-border-active);
            box-shadow: var(--shadow-active);
        }

        .card-text-node {
            font-size: 1.05rem;
            line-height: 1.65; 
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
            font-weight: 450;
            flex-grow: 1;
            user-select: text;
            transition: opacity 0.15s ease;
        }

        /* Global Short Mode (Triggered by 'S') */
        body.short-mode .card-text-node {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: normal;
        }

        /* Right Side Indicators Wrapper */
        .card-meta {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            flex-shrink: 0;
            margin-top: 0.2rem; 
        }

        /* Case Mode Letter Signifier */
        .case-number {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.04);
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.02);
            transition: var(--transition-smooth);
        }

        .glass-card.highlighted .case-number {
            color: #ffffff;
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        /* Minimal Copy Notification Badge */
        .feedback-badge {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #ffffff; 
            background: var(--accent-blue);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            opacity: 0;
            transform: scale(0.9) translateY(5px);
            transition: var(--transition-smooth);
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .glass-card.copied .feedback-badge {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .flash-clear {
            opacity: 0 !important;
            transform: translateY(15px);
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="brand-header">
            <h1>PASTER</h1>
        </header>

        <main class="card-stream" id="cardStream"></main>
    </div>

    <script>
        const cardStream = document.getElementById('cardStream');
        const allCards = []; 

        function toTitleCase(str) {
            return str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase());
        }

        // Double Click background to insert item from clipboard
        document.body.addEventListener('dblclick', async (event) => {
            if (event.target.closest('.glass-card')) return;

            try {
                const text = await navigator.clipboard.readText();
                if (!text || text.trim() === "") return;
                
                const newCard = appendGlassCard(text);
                newCard.element.classList.add('highlighted');
            } catch (err) {
                console.error("Clipboard engine failure: ", err);
            }
        });

        // Double Right-Click background to clear all boards completely
        let lastRightClickTime = 0;
        document.body.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const now = Date.now();
            if (now - lastRightClickTime < 400) {
                cardStream.classList.add('flash-clear');
                setTimeout(() => {
                    cardStream.innerHTML = '';
                    allCards.length = 0; 
                    cardStream.classList.remove('flash-clear');
                }, 300);
                lastRightClickTime = 0;
            } else {
                lastRightClickTime = now;
            }
        });

        // Global Keyboards Triggers
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 's') {
                e.preventDefault();
                document.body.classList.toggle('short-mode');
            }

            const isArrowKey = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code);
            const activeCards = allCards.filter(c => c.element.classList.contains('highlighted'));
            
            // Arrow Keys: Cycle case for ALL cards regardless of selection
            if (isArrowKey && allCards.length > 0) {
                e.preventDefault();
                allCards.forEach(card => card.cycleCase());
            }
            
            // Spacebar: Cycle case ONLY for highlighted/selected cards
            if (e.code === 'Space' && activeCards.length > 0) {
                e.preventDefault();
                activeCards.forEach(card => card.cycleCase());
            }
        });

        function appendGlassCard(initialContent) {
            const cardElement = document.createElement('div');
            cardElement.className = 'glass-card';

            const textDisplay = document.createElement('div');
            textDisplay.className = 'card-text-node';
            textDisplay.textContent = initialContent; 

            const metaContainer = document.createElement('div');
            metaContainer.className = 'card-meta';

            const badge = document.createElement('div');
            badge.className = 'feedback-badge';
            badge.textContent = 'Copied';

            // Alphabetic Normal case token
            const caseIndicator = document.createElement('div');
            caseIndicator.className = 'case-number';
            caseIndicator.textContent = 'N'; 

            metaContainer.appendChild(badge);
            metaContainer.appendChild(caseIndicator);
            cardElement.appendChild(textDisplay);
            cardElement.appendChild(metaContainer);

            let currentStateIndex = 3; 
            const originalRawText = initialContent;

            const cycleCase = () => {
                currentStateIndex = (currentStateIndex + 1) % 4;
                textDisplay.style.opacity = '0';

                setTimeout(() => {
                    if (currentStateIndex === 0) {
                        textDisplay.textContent = originalRawText.toUpperCase();
                        caseIndicator.textContent = 'U';
                    } else if (currentStateIndex === 1) {
                        textDisplay.textContent = originalRawText.toLowerCase();
                        caseIndicator.textContent = 'L';
                    } else if (currentStateIndex === 2) {
                        textDisplay.textContent = toTitleCase(originalRawText);
                        caseIndicator.textContent = 'T';
                    } else if (currentStateIndex === 3) {
                        textDisplay.textContent = originalRawText;
                        caseIndicator.textContent = 'N';
                    }
                    textDisplay.style.opacity = '1';
                }, 100);
            };

            const cardObject = { element: cardElement, cycleCase };
            allCards.push(cardObject);

            // Refactored Toggle Event Architecture 
            cardElement.addEventListener('click', (e) => {
                e.stopPropagation();
                
                // Toggle selection highlight natively
                cardElement.classList.toggle('highlighted');

                // If highlighted after the click, smoothly pipeline to clipboard
                if (cardElement.classList.contains('highlighted')) {
                    navigator.clipboard.writeText(textDisplay.textContent)
                        .then(() => {
                            cardElement.classList.add('copied');
                            setTimeout(() => cardElement.classList.remove('copied'), 1000);
                        })
                        .catch(err => console.error("Clipboard writing faulted: ", err));
                }
            });

            cardStream.prepend(cardElement);
            
            return cardObject;
        }
    </script>
</body>
</html>
