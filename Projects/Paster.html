<!Doctype Html>
<Html Lang="En">
<Head>
    <Meta Charset="Utf-8"/>
    <Meta Name="Viewport" Content="Width=Device-Width, Initial-Scale=1.0"/>
    <Link Rel="Icon" Type="Image/Png" Href="../Projects/Fc/Paster/Favicon-96x96.Png" Sizes="96x96" />
    <Link Rel="Icon" Type="Image/Svg+Xml" Href="../Projects/Fc/Paster/Favicon.Svg" />
    <Link Rel="Shortcut Icon" Href="../Projects/Fc/Paster/Favicon.Ico" />
    <Link Rel="Apple-Touch-Icon" Sizes="180x180" Href="../Projects/Fc/Paster/Apple-Touch-Icon.Png" />
    <Meta Name="Apple-Mobile-Web-App-Title" Content="Paster" />
    <Link Rel="Manifest" Href="../Projects/Fc/Paster/Site.Webmanifest" />
    <Title>Auto Paste | Prabodfx</Title>
    
    <Link Rel="Preconnect" Href="Https://Fonts.Googleapis.Com">
    <Link Rel="Preconnect" Href="Https://Fonts.Gstatic.Com" Crossorigin>
    <Link Href="Https://Fonts.Googleapis.Com/Css2?Family=Syne:Wght=700;800&Family=Outfit:Wght=300;400;500;600;700&Display=Swap" Rel="Stylesheet">
    
    <Style>
        :Root {
            --Transition-Smooth: All 0.4s Cubic-Bezier(0.16, 1, 0.3, 1);
        }

        * {
            Box-Sizing: Border-Box;
            Margin: 0;
            Padding: 0;
        }

        Html, Body {
            Height: 100%; 
        }

        Body {
            Font-Family: 'Outfit', Sans-Serif;
            Color: Rgba(235, 245, 255, 0.97);
            Overflow-Y: Auto;
            Position: Relative;
            -Webkit-User-Select: None;
            User-Select: None; 
            Background-Color: #1e3f85; 
            Touch-Action: Manipulation;
            Display: Flex;
            Flex-Direction: Column;
        }

        .Fixed-Scene {
            Position: Fixed;
            Inset: 0;
            Z-Index: -1;
            Overflow: Hidden;
            Background:
                Radial-Gradient(Ellipse 60% 50% At 18% 15%, Rgba(100,160,230,0.65) 0%, Transparent 55%),
                Radial-Gradient(Ellipse 50% 45% At 82% 80%, Rgba(55,110,195,0.55) 0%, Transparent 55%),
                Radial-Gradient(Ellipse 45% 40% At 55% 40%, Rgba(140,190,240,0.30) 0%, Transparent 50%),
                Linear-Gradient(148deg, #2a5298 0%, #3a6bbf 28%, #2d5aab 58%, #1e3f85 100%);
        }

        .Fixed-Scene::Before {
            Content: ''; Position: Absolute; Inset: 0;
            Background: Linear-Gradient(112deg,
                Transparent 28%,
                Rgba(255,255,255,0.06) 40%,
                Rgba(255,255,255,0.03) 48%,
                Transparent 60%);
            Pointer-Events: None;
        }

        .Orb { 
            Position: Absolute; 
            Border-Radius: 50%; 
            Pointer-Events: None; 
            Animation: Drift 22s Ease-In-Out Infinite; 
            Will-Change: Transform; /* Hardware Acceleration Optimization */
        }
        .O1 { Width: 500px; Height: 500px; Top: -180px; Left: -140px; Background: Radial-Gradient(Circle,Rgba(100,160,230,0.32) 0%,Transparent 70%); Filter: Blur(80px); }
        
        .O2 { 
            Width: 120vmax; 
            Height: 120vmax; 
            Bottom: -20%; 
            Right: -10%; 
            Background: Radial-Gradient(Circle,Rgba(50,100,200,0.25) 0%,Transparent 70%); 
            Filter: Blur(130px); 
            Animation-Duration: 35s; 
        }
        
        @Keyframes Drift {
            0%, 100% { Transform: Translate(0,0); }
            50% { Transform: Translate(20px,-16px); }
        }

        .Wrap {
            Width: 100%;
            Max-Width: 1400px; 
            Margin: 0 Auto;
            Padding: 48px 24px;
            Position: Relative;
            Z-Index: 2;
            Flex: 1; 
            Display: Flex;
            Flex-Direction: Column;
            Gap: 1.5rem;
        }

        .Logo {
            Margin: 0 Auto;
            Width: Max-Content;
            Padding: 13px 52px;
            Border-Radius: 100px;
            Display: Flex;
            Align-Items: Center;
            Gap: 12px;
            Position: Relative;
            Overflow: Hidden;
            Background: Rgba(255,255,255,0.12);
            Backdrop-Filter: Blur(40px) Saturate(180%);
            -Webkit-Backdrop-Filter: Blur(40px) Saturate(180%);
            Border-Top: 1px Solid Rgba(255,255,255,0.65);
            Border-Left: 1px Solid Rgba(255,255,255,0.32);
            Border-Right: 1px Solid Rgba(140,185,255,0.18);
            Border-Bottom: 1px Solid Rgba(90,140,235,0.24);
            Box-Shadow:
                0 8px 32px Rgba(0,0,0,0.20),
                0 2px 8px Rgba(0,0,0,0.12),
                Inset 0 1px 0 Rgba(255,255,255,0.55);
            Animation: Fadedown 0.8s Cubic-Bezier(0.16, 1, 0.3, 1) Forwards;
        }

        .Logo::After {
            Content: ''; Position: Absolute; Top: -60%; Left: -30%;
            Width: 14%; Height: 220%;
            Background: Linear-Gradient(90deg,Transparent,Rgba(255,255,255,0.40),Transparent);
            Transform: Skewx(-16deg);
            Animation: Sw 9s Cubic-Bezier(.25,1,.5,1) Infinite;
        }

        @Keyframes Sw { 0% { Left: -30%; } 100% { Left: 130%; } }

        .Dot {
            Width: 7px; Height: 7px; Border-Radius: 50%;
            Background: Radial-Gradient(Circle At 35% 35%,Rgba(255,255,255,0.95),Rgba(150,200,255,0.85));
            Box-Shadow: 0 0 10px Rgba(160,210,255,0.85),0 0 4px Rgba(255,255,255,0.65);
        }

        .Logo H1 {
            Font-Family: 'Syne', Sans-Serif; Font-Size: 21px;
            Letter-Spacing: 13px; Margin-Right: -13px; Font-Weight: 800;
            Background: Linear-Gradient(135deg,Rgba(255,255,255,0.98) 0%,Rgba(200,225,255,0.92) 50%,Rgba(255,255,255,0.98) 100%);
            -Webkit-Background-Clip: Text; Color: Transparent;
        }

        .Panel {
            Padding: 24px;
            Border-Radius: 28px;
            Display: Flex;
            Flex-Direction: Column;
            Position: Relative;
            Flex: 1; 
            Background: Rgba(255,255,255,0.10);
            Backdrop-Filter: Blur(60px) Saturate(200%);
            -Webkit-Backdrop-Filter: Blur(60px) Saturate(200%);
            Border-Top: 1px Solid Rgba(255,255,255,0.60);
            Border-Left: 1px Solid Rgba(255,255,255,0.28);
            Border-Right: 1px Solid Rgba(120,170,255,0.15);
            Border-Bottom: 1px Solid Rgba(80,130,230,0.22);
            Box-Shadow:
                0 40px 80px Rgba(0,0,0,0.25),
                0 12px 28px Rgba(0,0,0,0.15),
                Inset 0 1px 0 Rgba(255,255,255,0.50),
                Inset 0 0 60px Rgba(120,175,255,0.05);
            Transition: Opacity 0.3s Ease;
            Overflow: Hidden;
        }

        .Panel::Before {
            Content: ''; Position: Absolute; Top: 0; Left: 8%; Right: 8%; Height: 1px;
            Background: Linear-Gradient(90deg,Transparent,Rgba(255,255,255,0.85) 30%,Rgba(255,255,255,0.85) 70%,Transparent);
        }

        .Hint-Text {
            Position: Absolute;
            Top: 50%;
            Left: 50%;
            Transform: Translate(-50%, -50%);
            Text-Align: Center;
            Font-Size: 14px;
            Font-Weight: 500;
            Letter-Spacing: 3px;
            Color: Rgba(180, 215, 255, 0.75);
            Text-Transform: Uppercase;
            Animation: Fadeincenter 1s Cubic-Bezier(0.16, 1, 0.3, 1) 0.2s Forwards;
            Opacity: 0;
            Transition: Opacity 0.4s Ease, Visibility 0.4s Ease;
            Z-Index: 0;
            Pointer-Events: None;
        }

        .Hint-Text.Hidden {
            Opacity: 0;
            Visibility: Hidden;
        }

        @Keyframes Fadeincenter {
            From { Opacity: 0; Transform: Translate(-50%, -30%); }
            To { Opacity: 1; Transform: Translate(-50%, -50%); }
        }

        .Card-Stream {
            Display: Flex;
            Flex-Direction: Column;
            Gap: 16px;
            Width: 100%;
            Position: Relative;
            Z-Index: 1;
            Padding-Bottom: 24px;
        }

        .Glass-Card {
            Min-Height: 100px;
            Border-Radius: 16px;
            Cursor: Pointer;
            Position: Relative;
            Overflow: Hidden;
            Transition: All 0.3s Cubic-Bezier(0.16,1,0.3,1);
            Will-Change: Transform, Opacity; /* Optimizes Ui Rendering Pipeline */
            Background: Rgba(255,255,255,0.11);
            Backdrop-Filter: Blur(28px) Saturate(180%);
            -Webkit-Backdrop-Filter: Blur(28px) Saturate(180%);
            Border-Top: 1px Solid Rgba(255,255,255,0.62);
            Border-Left: 1px Solid Rgba(255,255,255,0.30);
            Border-Right: 1px Solid Rgba(120,170,250,0.18);
            Border-Bottom: 1px Solid Rgba(80,130,225,0.26);
            Box-Shadow:
                0 8px 28px Rgba(0,0,0,0.18),
                0 2px 8px Rgba(0,0,0,0.10),
                Inset 0 1px 0 Rgba(255,255,255,0.52),
                Inset 0 -1px 0 Rgba(90,145,235,0.16),
                Inset 1px 0 0 Rgba(255,255,255,0.20),
                Inset -1px 0 0 Rgba(90,145,235,0.10);
            
            Display: Flex;
            Flex-Direction: Row; 
            Align-Items: Center; 
            Justify-Content: Space-Between;
            Gap: 2rem;
            Padding: 22px 24px;
            Animation: Slideup 0.5s Cubic-Bezier(0.16, 1, 0.3, 1) Forwards;
        }

        .Glass-Card.Is-Long {
            Align-Items: Flex-Start;
        }

        .Glass-Card::Before {
            Content: ''; Position: Absolute; Top: 0; Left: 5%; Right: 5%; Height: 1px;
            Background: Linear-Gradient(90deg,Transparent,Rgba(255,255,255,0.90) 35%,Rgba(255,255,255,0.90) 65%,Transparent);
        }
        
        .Glass-Card::After {
            Content: ''; Position: Absolute; Inset: 0;
            Background: Radial-Gradient(Ellipse 60% 50% At 15% -5%,Rgba(190,220,255,0.10),Transparent 60%);
            Opacity: 0; Transition: Opacity 0.3s Ease; Pointer-Events: None;
        }

        .Glass-Card:Hover {
            Transform: Translatey(-4px) Scale(1.005);
            Background: Rgba(255,255,255,0.18);
            Border-Top: 1px Solid Rgba(255,255,255,0.85);
            Border-Left: 1px Solid Rgba(255,255,255,0.48);
            Border-Right: 1px Solid Rgba(130,180,255,0.28);
            Border-Bottom: 1px Solid Rgba(85,140,230,0.38);
            Box-Shadow:
                0 20px 40px Rgba(0,0,0,0.24),
                0 8px 20px Rgba(0,0,0,0.14),
                Inset 0 1px 0 Rgba(255,255,255,0.72),
                Inset 0 -1px 0 Rgba(90,145,235,0.24),
                Inset 1px 0 0 Rgba(255,255,255,0.32),
                Inset -1px 0 0 Rgba(90,145,235,0.16);
            Z-Index: 99990 !Important; 
        }
        .Glass-Card:Hover::After { Opacity: 1; }

        .Glass-Card.Highlighted {
            Background: Rgba(255, 255, 255, 0.25); 
            Border: 1px Solid Rgba(255, 255, 255, 0.95) !Important; 
            Box-Shadow: 
                0 25px 60px Rgba(0,0,0,0.5),
                0 0 45px Rgba(255, 255, 255, 0.3), 
                Inset 0 1px 0 Rgba(255,255,255,0.8),
                Inset 0 0 25px Rgba(150, 200, 255, 0.4);
            Transform: Scale(1.02);
            Z-Index: 99999 !Important; 
        }

        .Card-Text-Node {
            Font-Size: 16px;
            Font-Weight: 400;
            Line-Height: 1.55; 
            Color: Rgba(235,245,255,0.97);
            White-Space: Pre-Wrap;
            Word-Break: Break-Word;
            Flex: 1;
            User-Select: Text;
            Transition: Color 0.3s Ease, Font-Weight 0.3s Ease, Opacity 0.15s Ease;
            Z-Index: 2; 
        }

        /* Changes Color, Makes Text Bold, And Adds High-Contrast Glow When Card Is Highlighted */
        .Glass-Card.Highlighted .Card-Text-Node {
            Color: #F0f9ff;
            Font-Weight: 700;
            Text-Shadow: 0 0 10px Rgba(255, 255, 255, 0.5), 0 2px 4px Rgba(0, 0, 0, 0.3);
        }

        Body.Short-Mode .Card-Text-Node {
            Display: -Webkit-Box;
            -Webkit-Line-Clamp: 2;
            -Webkit-Box-Orient: Vertical;
            Overflow: Hidden;
            Text-Overflow: Ellipsis;
            White-Space: Normal;
        }

        .Card-Meta {
            Display: Flex;
            Align-Items: Center;
            Gap: 12px;
            Flex-Shrink: 0;
            Position: Relative;
            Z-Index: 10;
        }

        .Glass-Card.Is-Long .Card-Meta {
            Margin-Top: 2px;
        }

        .Case-Number {
            Padding: 5px 15px;
            Border-Radius: 100px;
            Font-Size: 12px;
            Font-Weight: 800;
            Letter-Spacing: 0.8px;
            Color: #Ffffff; 
            Background: #Ff3333; 
            Backdrop-Filter: Blur(12px);
            -Webkit-Backdrop-Filter: Blur(12px);
            Border: 1px Solid #Ff4d4d;
            Box-Shadow: 0 0 10px Rgba(255, 50, 50, 0.4), Inset 0 1px 0 Rgba(255,255,255,0.3);
            Transition: Transform 0.2s Cubic-Bezier(0.16, 1, 0.3, 1), Box-Shadow 0.2s Ease;
            Text-Align: Center;
            Min-Width: 40px;
            Cursor: Pointer;
        }

        .Case-Number:Hover {
            Transform: Scale(1.08);
            Box-Shadow: 0 0 15px Rgba(255, 50, 50, 0.6), Inset 0 1px 0 Rgba(255,255,255,0.4);
        }

        .Feedback-Badge {
            Position: Absolute;
            Right: 60px;
            Padding: 5px 15px;
            Border-Radius: 100px;
            Font-Size: 12px;
            Font-Weight: 600;
            Letter-Spacing: 0.8px;
            Color: Rgba(220,238,255,0.95);
            Background: Rgba(100, 180, 255, 0.7);
            Border: 1px Solid Rgba(255,255,255,0.6);
            Backdrop-Filter: Blur(12px);
            -Webkit-Backdrop-Filter: Blur(12px);
            Opacity: 0;
            Transform: Scale(0.9) Translatex(10px);
            White-Space: Nowrap;
            Pointer-Events: None;
            Box-Shadow: 0 4px 15px Rgba(50, 120, 220, 0.4);
            Transition: Var(--Transition-Smooth);
        }

        .Glass-Card.Copied .Feedback-Badge {
            Opacity: 1;
            Transform: Scale(1) Translatex(0);
        }

        .Flash-Clear {
            Opacity: 0 !Important;
            Transform: Translatey(15px);
        }

        .Mobile-Short-Btn {
            Display: None;
        }

        @Keyframes Fadedown {
            From { Opacity: 0; Transform: Translatey(-15px); }
            To { Opacity: 1; Transform: Translatey(0); }
        }

        @Keyframes Slideup {
            From { Opacity: 0; Transform: Translatey(20px); }
            To { Opacity: 1; Transform: Translatey(0); }
        }

        @Media (Max-Width: 600px) {
            .Wrap { Padding: 32px 16px; }
            .Logo { Padding: 12px 32px; }
            .Logo H1 { Font-Size: 18px; Letter-Spacing: 8px; Margin-Right: -8px; }
            .Hint-Text { Font-Size: 12px; Letter-Spacing: 2px; }
            .Glass-Card { Padding: 18px 16px; Gap: 1rem; }
            .Card-Text-Node { Font-Size: 14px; }
            .Panel { Padding: 24px 16px 16px; }

            .Mobile-Short-Btn {
                Display: Flex;
                Position: Fixed;
                Bottom: 24px;
                Right: 24px;
                Z-Index: 999;
                Width: 56px;
                Height: 56px;
                Border-Radius: 50%;
                Background: Rgba(255, 255, 255, 0.15);
                Backdrop-Filter: Blur(20px) Saturate(180%);
                -Webkit-Backdrop-Filter: Blur(20px) Saturate(180%);
                Border-Top: 1px Solid Rgba(255, 255, 255, 0.6);
                Border-Left: 1px Solid Rgba(255, 255, 255, 0.3);
                Border-Right: 1px Solid Rgba(120, 170, 250, 0.2);
                Border-Bottom: 1px Solid Rgba(80, 130, 225, 0.3);
                Align-Items: Center;
                Justify-Content: Center;
                Box-Shadow: 0 12px 36px Rgba(0, 0, 0, 0.35), Inset 0 1px 0 Rgba(255,255,255,0.4);
                Cursor: Pointer;
                Font-Family: 'Syne', Sans-Serif;
                Font-Size: 16px;
                Font-Weight: 800;
                Color: #Ffffff;
                Transition: Transform 0.2s Ease, Background 0.2s Ease;
            }
            .Mobile-Short-Btn:Active {
                Transform: Scale(0.9);
                Background: Rgba(255, 255, 255, 0.25);
            }
        }
    </Style>
</Head>
<Body>

    <Div Class="Fixed-Scene">
        <Div Class="Orb O1"></Div>
        <Div Class="Orb O2"></Div>
    </Div>

    <Div Class="Wrap">
        <Header Class="Logo Brand-Header">
            <Div Class="Dot"></Div>
            <H1>Paster</H1>
            <Div Class="Dot"></Div>
        </Header>

        <Main Class="Panel">
            <Div Class="Hint-Text" Id="Hinttext">Double Tap Or Double Click To Paste</Div>
            <Div Class="Card-Stream" Id="Cardstream"></Div>
        </Main>
    </Div>

    <Div Class="Mobile-Short-Btn" Id="Mobileshortbtn">S</Div>

    <Script>
        Const Cardstream = Document.Getelementbyid('Cardstream');
        Const Hinttext = Document.Getelementbyid('Hinttext');
        Const Mobileshortbtn = Document.Getelementbyid('Mobileshortbtn');
        Const Allcards = []; 

        Function Totitlecase(Str) {
            Return Str.Tolowercase().Replace(/\B\W/G, S => S.Touppercase());
        }

        Async Function Handlepasteevent() {
            Try {
                Const Text = Await Navigator.Clipboard.Readtext();
                If (!Text || Text.Trim() === "") Return;
                
                Const Newcard = Appendglasscard(Text);
                Newcard.Element.Classlist.Add('Highlighted');
                
                If (Hinttext) {
                    Hinttext.Classlist.Add('Hidden');
                }
            } Catch (Err) {
                Console.Error("Clipboard Engine Failure: ", Err);
            }
        }

        Document.Body.Addeventlistener('Dblclick', (Event) => {
            If (Event.Target.Closest('.Glass-Card')) Return;
            Handlepasteevent();
        });

        Let Lasttaptime = 0;
        Document.Body.Addeventlistener('Touchend', (Event) => {
            If (Event.Target.Closest('.Glass-Card') || Event.Target.Closest('#Mobileshortbtn')) Return;
            
            Const Currenttime = New Date().Gettime();
            Const Taplength = Currenttime - Lasttaptime;
            
            If (Taplength < 500 && Taplength > 0) {
                Event.Preventdefault(); 
                Handlepasteevent();
            }
            Lasttaptime = Currenttime;
        });

        Let Lastrightclicktime = 0;
        Document.Body.Addeventlistener('Contextmenu', (E) => {
            E.Preventdefault();
            Const Now = Date.Now();
            If (Now - Lastrightclicktime < 400) {
                Cardstream.Classlist.Add('Flash-Clear');
                Settimeout(() => {
                    Cardstream.Innerhtml = '';
                    Allcards.Length = 0; 
                    Cardstream.Classlist.Remove('Flash-Clear');
                    If (Hinttext) {
                        Hinttext.Classlist.Remove('Hidden');
                    }
                }, 300);
                Lastrightclicktime = 0;
            } Else {
                Lastrightclicktime = Now;
            }
        });

        Document.Addeventlistener('Keydown', (E) => {
            If (E.Key.Tolowercase() === 'S') {
                E.Preventdefault();
                Document.Body.Classlist.Toggle('Short-Mode');
            }

            Const Isarrowkey = ['Arrowup', 'Arrowdown', 'Arrowleft', 'Arrowright'].Includes(E.Code);
            Const Activecards = Allcards.Filter(C => C.Element.Classlist.Contains('Highlighted'));
            
            If (Isarrowkey && Allcards.Length > 0) {
                E.Preventdefault();
                Allcards.Foreach(Card => Card.Cyclecase());
            }
            
            If (E.Code === 'Space' && Activecards.Length > 0) {
                E.Preventdefault();
                Activecards.Foreach(Card => Card.Cyclecase());
            }
        });

        If (Mobileshortbtn) {
            Mobileshortbtn.Addeventlistener('Click', (E) => {
                E.Stoppropagation();
                Document.Body.Classlist.Toggle('Short-Mode');
                If (Document.Body.Classlist.Contains('Short-Mode')) {
                    Mobileshortbtn.Textcontent = 'Full';
                } Else {
                    Mobileshortbtn.Textcontent = 'S';
                }
            });
        }

        Function Appendglasscard(Initialcontent) {
            Const Cardelement = Document.Createelement('Div');
            Cardelement.Classname = 'Glass-Card';
            
            Cardelement.Style.Zindex = 10000 - Allcards.Length;

            If (Initialcontent.Length > 60) {
                Cardelement.Classlist.Add('Is-Long');
            }

            Const Textdisplay = Document.Createelement('Div');
            Textdisplay.Classname = 'Card-Text-Node';
            Textdisplay.Textcontent = Initialcontent; 

            Const Metacontainer = Document.Createelement('Div');
            Metacontainer.Classname = 'Card-Meta';

            Const Badge = Document.Createelement('Div');
            Badge.Classname = 'Feedback-Badge';
            Badge.Textcontent = 'Copied';

            Const Caseindicator = Document.Createelement('Div');
            Caseindicator.Classname = 'Case-Number';
            Caseindicator.Textcontent = 'N'; 

            Metacontainer.Appendchild(Badge);
            Metacontainer.Appendchild(Caseindicator);
            Cardelement.Appendchild(Textdisplay);
            Cardelement.Appendchild(Metacontainer);

            Let Currentstateindex = 3; 
            Const Originalrawtext = Initialcontent;

            Const Cyclecase = () => {
                Currentstateindex = (Currentstateindex + 1) % 4;
                Textdisplay.Style.Opacity = '0';

                Let Newtext = "";

                If (Currentstateindex === 0) {
                    Newtext = Originalrawtext.Touppercase();
                    Caseindicator.Textcontent = 'U';
                } Else If (Currentstateindex === 1) {
                    Newtext = Originalrawtext.Tolowercase();
                    Caseindicator.Textcontent = 'L';
                } Else If (Currentstateindex === 2) {
                    Newtext = Totitlecase(Originalrawtext);
                    Caseindicator.Textcontent = 'T';
                } Else If (Currentstateindex === 3) {
                    Newtext = Originalrawtext;
                    Caseindicator.Textcontent = 'N';
                }

                Settimeout(() => {
                    Textdisplay.Textcontent = Newtext;
                    Textdisplay.Style.Opacity = '1';
                }, 100);

                Return Newtext; 
            };

            Const Cardobject = { Element: Cardelement, Cyclecase };
            Allcards.Push(Cardobject);

            Caseindicator.Addeventlistener('Click', (E) => {
                E.Stoppropagation(); 
                Const Newtext = Cyclecase();
                
                Navigator.Clipboard.Writetext(Newtext).Then(() => {
                    Cardelement.Classlist.Add('Copied');
                    Settimeout(() => Cardelement.Classlist.Remove('Copied'), 1000);
                }).Catch(Err => Console.Error("Clipboard Writing Faulted: ", Err));
            });

            Cardelement.Addeventlistener('Click', (E) => {
                E.Stoppropagation();
                
                Cardelement.Classlist.Toggle('Highlighted');

                Navigator.Clipboard.Writetext(Textdisplay.Textcontent)
                    .Then(() => {
                        Cardelement.Classlist.Add('Copied');
                        Settimeout(() => Cardelement.Classlist.Remove('Copied'), 1000);
                    })
                    .Catch(Err => Console.Error("Clipboard Writing Faulted: ", Err));
            });

            Cardstream.Prepend(Cardelement);
            
            Return Cardobject;
        }
    </Script>
</Body>
</Html>
